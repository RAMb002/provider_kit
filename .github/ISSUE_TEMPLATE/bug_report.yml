name: Bug Report
description: Report a reproducible problem with ProviderKit
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please provide enough information to help us reproduce and investigate the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clearly describe the problem.
      placeholder: Describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide the smallest set of steps needed to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: If possible, provide a minimal code example that reproduces the issue.
      render: dart

  - type: input
    id: provider-kit-version
    attributes:
      label: ProviderKit Version
      description: Which version of ProviderKit are you using?
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter Version
      description: Which Flutter version are you using?
      placeholder: "3.44.6"

  - type: input
    id: dart-version
    attributes:
      label: Dart Version
      description: Which Dart version are you using?
      placeholder: "3.11.5"

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where does the issue occur?
      options:
        - Android
        - iOS
        - Web
        - Windows
        - macOS
        - Linux
        - Windows
        - All
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, attach screenshots or screen recordings that help explain the issue.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add logs, stack traces, related issues, or any other relevant information.