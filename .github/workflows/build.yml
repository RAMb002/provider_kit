name: Build

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - package: provider_kit
            path: packages/provider_kit
            type: flutter
            flutter_version: '3.44'

          - package: rate_kit
            path: packages/rate_kit
            type: dart
            dart_version: '3.12.2'

    steps:
      # ------------------------------------------------
      # Checkout
      # ------------------------------------------------

      - name: 📚 Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------
      # Setup SDK
      # ------------------------------------------------

      - name: 🐦 Setup Flutter
        if: matrix.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter_version }}
          channel: stable
          cache: true
          pub-cache: true

      - name: 🎯 Setup Dart
        if: matrix.type == 'dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart_version }}

      # ------------------------------------------------
      # Cache Dart pub dependencies
      # ------------------------------------------------

      - name: 💾 Cache Dart dependencies
        if: matrix.type == 'dart'
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-dart-pub-${{ matrix.package }}-${{ hashFiles(format('{0}/pubspec.yaml', matrix.path)) }}
          restore-keys: |
            ${{ runner.os }}-dart-pub-${{ matrix.package }}-

      # ------------------------------------------------
      # Install dependencies
      # ------------------------------------------------

      - name: 📦 Install Flutter dependencies
        if: matrix.type == 'flutter'
        working-directory: ${{ matrix.path }}
        run: flutter pub get

      - name: 📦 Install Dart dependencies
        if: matrix.type == 'dart'
        working-directory: ${{ matrix.path }}
        run: dart pub get

      # ------------------------------------------------
      # Format
      # ------------------------------------------------

      - name: 🎨 Check formatting
        working-directory: ${{ matrix.path }}
        run: dart format --output=none --set-exit-if-changed .

      # ------------------------------------------------
      # Analyze
      # ------------------------------------------------

      - name: 🔍 Analyze Flutter package
        if: matrix.type == 'flutter'
        working-directory: ${{ matrix.path }}
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 🔍 Analyze Dart package
        if: matrix.type == 'dart'
        working-directory: ${{ matrix.path }}
        run: dart analyze --fatal-infos --fatal-warnings

      # ------------------------------------------------
      # Tests + coverage
      # ------------------------------------------------

      - name: 🧪 Test Flutter package
        if: matrix.type == 'flutter'
        working-directory: ${{ matrix.path }}
        run: flutter test --coverage

      - name: 🧰 Install Dart coverage tooling
        if: matrix.type == 'dart'
        run: dart pub global activate coverage 1.15.1

      - name: 🧪 Test Dart package with coverage
        if: matrix.type == 'dart'
        working-directory: ${{ matrix.path }}
        run: dart pub global run coverage:test_with_coverage

      # ------------------------------------------------
      # Codecov
      # ------------------------------------------------

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.path }}/coverage/lcov.info
          flags: ${{ matrix.package }}
          disable_search: true
          fail_ci_if_error: true