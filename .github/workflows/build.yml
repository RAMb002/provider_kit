
name: Build

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - dev
      - main

  push:
    branches:
      - dev
      - main

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ------------------------------------------------
  # Detect changed packages
  # ------------------------------------------------

  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest

    outputs:
      provider_kit: ${{ steps.filter.outputs.provider_kit || steps.manual.outputs.provider_kit }}
      rate_kit: ${{ steps.filter.outputs.rate_kit || steps.manual.outputs.rate_kit }}

    steps:
      - name: 📚 Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Detect package changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event.pull_request.base.ref || github.ref }}
          filters: |
            provider_kit:
              - 'packages/provider_kit/**'
              - '.github/workflows/**'
              - '.gitignore'
              - 'analysis_options.yaml'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'tool/**'

            rate_kit:
              - 'packages/rate_kit/**'
              - '.github/workflows/**'
              - '.gitignore'
              - 'analysis_options.yaml'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'tool/**'

      # Manual dispatch always builds both packages.
      - name: 🔧 Enable all packages for manual run
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "provider_kit=true" >> "$GITHUB_OUTPUT"
          echo "rate_kit=true" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------
  # ProviderKit
  # ------------------------------------------------

  provider_kit:
    name: Build ProviderKit
    needs: changes
    if: needs.changes.outputs.provider_kit == 'true'

    uses: ./.github/workflows/build_package.yml

    with:
      package: provider_kit
      path: packages/provider_kit
      type: flutter

    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ------------------------------------------------
  # RateKit
  # ------------------------------------------------

  rate_kit:
    name: Build RateKit
    needs: changes
    if: needs.changes.outputs.rate_kit == 'true'

    uses: ./.github/workflows/build_package.yml

    with:
      package: rate_kit
      path: packages/rate_kit
      type: dart

    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
