name: Release

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: true
        type: choice
        options:
          - provider_kit
          - rate_kit

      version_bump:
        description: 'Type of version bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

      dry_run:
        description: 'Dry run only?'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ inputs.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ------------------------------------------------
      # Authentication
      # ------------------------------------------------

      - name: 📚 Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: 👤 Configure Git user
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------
      # Guards and package configuration
      # ------------------------------------------------

      - name: 🔒 Verify release branch
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "❌ Release must be run from main."
            echo "Current ref: $GITHUB_REF"
            exit 1
          fi

      - name: 📦 Resolve package
        id: package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail

          case "$PACKAGE" in
            provider_kit)
              echo "path=packages/provider_kit" >> "$GITHUB_OUTPUT"
              echo "type=flutter" >> "$GITHUB_OUTPUT"
              ;;

            rate_kit)
              echo "path=packages/rate_kit" >> "$GITHUB_OUTPUT"
              echo "type=dart" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "❌ Unsupported package: $PACKAGE"
              exit 1
              ;;
          esac

      # ------------------------------------------------
      # Capture exact remote state
      # ------------------------------------------------

      - name: 📡 Fetch repository state
        id: repository
        run: |
          set -euo pipefail

          git fetch origin main dev --tags

          MAIN_SHA=$(git rev-parse origin/main)
          DEV_SHA=$(git rev-parse origin/dev)

          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"

          echo "Main: $MAIN_SHA"
          echo "Dev : $DEV_SHA"

      - name: 🌿 Checkout exact main
        run: |
          set -euo pipefail

          git checkout -B main "${{ steps.repository.outputs.main_sha }}"

      # ------------------------------------------------
      # Validate current released version and tag
      # ------------------------------------------------

      - name: 🔎 Read current package version
        id: current-version
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail

          VERSION=$(
            sed -n 's/^version:[[:space:]]*//p' \
              "$PACKAGE_PATH/pubspec.yaml" |
              head -n 1
          )

          if [[ -z "$VERSION" ]]; then
            echo "❌ Could not determine current package version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: 🏷️ Verify current release tag
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.current-version.outputs.version }}
          MAIN_SHA: ${{ steps.repository.outputs.main_sha }}
        run: |
          set -euo pipefail

          TAG="${PACKAGE}-v${VERSION}"

          TAG_SHA=$(git rev-list -n 1 "$TAG" 2>/dev/null || true)

          if [[ -z "$TAG_SHA" ]]; then
            echo "❌ Current release tag does not exist: $TAG"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA"; then
            echo "❌ Current release tag is not in main's history: $TAG"
            exit 1
          fi

          echo "✅ Current release tag verified: $TAG"

      # ------------------------------------------------
      # Ensure the selected package has not already been
      # versioned on dev independently of main.
      # ------------------------------------------------

      - name: 🔒 Verify package version on dev
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          MAIN_SHA: ${{ steps.repository.outputs.main_sha }}
          DEV_SHA: ${{ steps.repository.outputs.dev_sha }}
        run: |
          set -euo pipefail

          MAIN_VERSION=$(
            git show "$MAIN_SHA:$PACKAGE_PATH/pubspec.yaml" |
            sed -n 's/^version:[[:space:]]*//p' |
            head -n 1
          )

          DEV_VERSION=$(
            git show "$DEV_SHA:$PACKAGE_PATH/pubspec.yaml" |
            sed -n 's/^version:[[:space:]]*//p' |
            head -n 1
          )

          echo "Main version: $MAIN_VERSION"
          echo "Dev version : $DEV_VERSION"

          if [[ "$MAIN_VERSION" != "$DEV_VERSION" ]]; then
            echo "❌ Package version differs between main and dev."
            echo "Merge the previous release synchronization PR into dev first."
            exit 1
          fi

          echo "✅ Main and dev package versions match."

      # ------------------------------------------------
      # Toolchains
      # ------------------------------------------------

      - name: 🐦 Setup Flutter
        if: steps.package.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: 🎯 Setup Dart
        if: steps.package.outputs.type == 'dart'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 🔎 Verify toolchain versions
        run: |
          set -euo pipefail

          if [[ "${{ steps.package.outputs.type }}" == "flutter" ]]; then
            echo "Flutter:"
            flutter --version
            echo "Bundled Dart:"
            dart --version
          else
            echo "Dart:"
            dart --version
          fi

      # ------------------------------------------------
      # Version bump
      # ------------------------------------------------

      - name: 📈 Bump package version
        id: bump
        run: |
          set -euo pipefail

          NEW_VERSION=$(
            dart tool/bump_version.dart \
              "${{ steps.package.outputs.path }}" \
              "${{ inputs.version_bump }}"
          )

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ New version: $NEW_VERSION"

      # ------------------------------------------------
      # Install dependencies
      # ------------------------------------------------

      - name: 📦 Install Flutter dependencies
        if: steps.package.outputs.type == 'flutter'
        working-directory: ${{ steps.package.outputs.path }}
        run: flutter pub get

      - name: 📦 Install Dart dependencies
        if: steps.package.outputs.type == 'dart'
        working-directory: ${{ steps.package.outputs.path }}
        run: dart pub get

      # ------------------------------------------------
      # Format selected package
      # ------------------------------------------------

      - name: 🎨 Check formatting
        working-directory: ${{ steps.package.outputs.path }}
        run: dart format --output=none --set-exit-if-changed .

      # ------------------------------------------------
      # Analyze
      # ------------------------------------------------

      - name: 🔍 Analyze Flutter package
        if: steps.package.outputs.type == 'flutter'
        working-directory: ${{ steps.package.outputs.path }}
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: 🔍 Analyze Dart package
        if: steps.package.outputs.type == 'dart'
        working-directory: ${{ steps.package.outputs.path }}
        run: dart analyze --fatal-infos --fatal-warnings

      # ------------------------------------------------
      # Test
      # ------------------------------------------------

      - name: 🧪 Test Flutter package
        if: steps.package.outputs.type == 'flutter'
        working-directory: ${{ steps.package.outputs.path }}
        run: flutter test

      - name: 🧪 Test Dart package
        if: steps.package.outputs.type == 'dart'
        working-directory: ${{ steps.package.outputs.path }}
        run: dart test

      # ------------------------------------------------
      # Final release validation
      # ------------------------------------------------

      - name: 🔒 Validate release state
        env:
          MAIN_SHA: ${{ steps.repository.outputs.main_sha }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          PACKAGE: ${{ inputs.package }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          git diff --check

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              packages/*)
                if [[ "$file" != "$PACKAGE_PATH/"* ]]; then
                  echo "❌ Unexpected package change: $file"
                  exit 1
                fi
                ;;

              *)
                ;;
            esac
          done < <(git diff --name-only "$MAIN_SHA")

          TAG="${PACKAGE}-v${NEW_VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Local target tag already exists: $TAG"
            exit 1
          fi

          set +e
          git ls-remote \
            --exit-code \
            --tags \
            origin \
            "refs/tags/$TAG" >/dev/null
          STATUS=$?
          set -e

          case "$STATUS" in
            0)
              echo "❌ Remote target tag already exists: $TAG"
              exit 1
              ;;
            2)
              echo "✅ Remote target tag does not exist."
              ;;
            *)
              echo "❌ Failed to check remote tag. Git exited with status $STATUS."
              exit "$STATUS"
              ;;
          esac

          echo "✅ Final release validation passed."

      # ------------------------------------------------
      # Dry run
      # ------------------------------------------------

      - name: 🚨 Dry-run preview
        if: inputs.dry_run
        env:
          MAIN_SHA: ${{ steps.repository.outputs.main_sha }}
          PACKAGE: ${{ inputs.package }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          set -euo pipefail

          TAG="${PACKAGE}-v${NEW_VERSION}"

          echo "========================================"
          echo "DRY RUN"
          echo "========================================"
          echo "Package : $PACKAGE"
          echo "Current : ${{ steps.current-version.outputs.version }}"
          echo "New     : $NEW_VERSION"
          echo "Tag     : $TAG"
          echo ""

          echo "Source main commit: $MAIN_SHA"
          echo "Selected package: $PACKAGE"

          echo ""
          echo "Changes produced by this release:"
          git diff --name-status "$MAIN_SHA"

          echo ""
          echo "Final release diff:"
          git diff --stat "$MAIN_SHA"

          echo ""
          echo "✅ All release checks passed."
          echo "✅ No commit was created."
          echo "✅ No tag was created."
          echo "✅ No remote push was performed."
          echo "✅ No synchronization PR was created."

      # ------------------------------------------------
      # Real release: version bump commit
      # ------------------------------------------------

      - name: 💾 Commit version bump
        if: ${{ !inputs.dry_run }}
        id: release-commit
        env:
          PACKAGE: ${{ inputs.package }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail

          git add -- \
            "$PACKAGE_PATH/pubspec.yaml" \
            "$PACKAGE_PATH/CHANGELOG.md" \
            "$PACKAGE_PATH/README.md"

          if git diff --cached --quiet; then
            echo "❌ No version bump changes found."
            exit 1
          fi

          git commit \
            -m "chore(${PACKAGE}): bump version to ${NEW_VERSION}"

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------
      # Create tag locally
      # ------------------------------------------------

      - name: 🏷️ Create release tag
        if: ${{ !inputs.dry_run }}
        env:
          PACKAGE: ${{ inputs.package }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          MAIN_SHA: ${{ steps.repository.outputs.main_sha }}
        run: |
          set -euo pipefail

          TAG="${PACKAGE}-v${NEW_VERSION}"

          git tag -a "$TAG" \
            -m "Release ${PACKAGE} ${NEW_VERSION}" \
            -m "Source main commit: ${MAIN_SHA}"

          echo "✅ Created local tag: $TAG"

      # ------------------------------------------------
      # Remote race protection
      # ------------------------------------------------

      - name: 🔒 Verify remote state before push
        if: ${{ !inputs.dry_run }}
        env:
          EXPECTED_MAIN_SHA: ${{ steps.repository.outputs.main_sha }}
          EXPECTED_DEV_SHA: ${{ steps.repository.outputs.dev_sha }}
        run: |
          set -euo pipefail

          git fetch origin main dev --tags

          CURRENT_MAIN_SHA=$(git rev-parse origin/main)
          CURRENT_DEV_SHA=$(git rev-parse origin/dev)

          if [[ "$CURRENT_MAIN_SHA" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "❌ main changed while the release was running."
            exit 1
          fi

          if [[ "$CURRENT_DEV_SHA" != "$EXPECTED_DEV_SHA" ]]; then
            echo "❌ dev changed while the release was running."
            exit 1
          fi

          echo "✅ main and dev are unchanged."

      # ------------------------------------------------
      # Create a fresh GitHub App token immediately before
      # remote mutation so the 1-hour token lifetime starts
      # as late as possible.
      # ------------------------------------------------

      - name: 🔐 Create fresh release GitHub App token
        if: ${{ !inputs.dry_run }}
        id: mutation-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # ------------------------------------------------
      # Push main + release tag atomically
      # ------------------------------------------------

      - name: 🚀 Atomically push main and release tag
        if: ${{ !inputs.dry_run }}
        id: release-push
        env:
          PACKAGE: ${{ inputs.package }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          MUTATION_TOKEN: ${{ steps.mutation-token.outputs.token }}
        run: |
          set -euo pipefail

          TAG="${PACKAGE}-v${NEW_VERSION}"

          AUTH=$(printf 'x-access-token:%s' "$MUTATION_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"

          git \
            -c http.https://github.com/.extraheader= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push --atomic origin \
              "HEAD:refs/heads/main" \
              "$TAG:refs/tags/$TAG"

          echo "✅ main and $TAG pushed atomically."

      # ------------------------------------------------
      # Prepare sync branch AFTER successful release.
      # It starts from the exact dev snapshot captured at the beginning.
      # Existing unreleased dev work is preserved.
      # Commits pushed after the snapshot are not included in this PR.
      # ------------------------------------------------

      - name: 🌿 Prepare dev synchronization branch
        if: |
          !inputs.dry_run &&
          steps.release-push.outcome == 'success'
        id: sync
        env:
          PACKAGE: ${{ inputs.package }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          DEV_SHA: ${{ steps.repository.outputs.dev_sha }}
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        run: |
          set -euo pipefail

          SYNC_BRANCH="chore/release-sync/${PACKAGE}-v${NEW_VERSION}"

          echo "branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

          git fetch origin dev

          set +e
          git ls-remote \
            --exit-code \
            --heads \
            origin \
            "refs/heads/$SYNC_BRANCH" >/dev/null
          STATUS=$?
          set -e

          case "$STATUS" in
            0)
              echo "❌ Synchronization branch already exists: $SYNC_BRANCH"
              exit 1
              ;;
            2)
              echo "✅ Synchronization branch does not exist."
              ;;
            *)
              echo "❌ Failed to check remote synchronization branch. Git exited with status $STATUS."
              exit "$STATUS"
              ;;
          esac

          # Start from the exact dev snapshot used by this release.
          git checkout -B "$SYNC_BRANCH" "$DEV_SHA"

          # Merge main's release changes into dev without discarding newer dev work
          git merge --no-ff --no-edit "$RELEASE_SHA"

          # The released Unreleased section has now become the versioned
          # section. Create a fresh, empty Unreleased section for future work.
          CHANGELOG="$PACKAGE_PATH/CHANGELOG.md"

          if ! grep -Eq '^##[[:space:]]+Unreleased[[:space:]]*$' "$CHANGELOG"; then
            TMP_CHANGELOG=$(mktemp)

            {
              printf '## Unreleased\n\n'
              cat "$CHANGELOG"
            } > "$TMP_CHANGELOG"

            mv "$TMP_CHANGELOG" "$CHANGELOG"
          else
            echo "ℹ️ Preserving the existing Unreleased section from dev."
          fi

          git add "$CHANGELOG"

          git diff --cached --check

          if ! git diff --cached --quiet; then
            git commit \
              -m "chore(${PACKAGE}): sync release ${NEW_VERSION} to dev"
          else
            echo "ℹ️ No additional changelog update needed."
            echo "The merge commit already contains the synchronization."
          fi

          echo "✅ Synchronization branch prepared: $SYNC_BRANCH"

      # ------------------------------------------------
      # Push sync branch and create PR
      # ------------------------------------------------

      - name: 🚀 Push synchronization branch
        if: |
          !inputs.dry_run &&
          steps.release-push.outcome == 'success' &&
          steps.sync.outcome == 'success'
        id: sync-push
        env:
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          MUTATION_TOKEN: ${{ steps.mutation-token.outputs.token }}
        run: |
          set -euo pipefail

          AUTH=$(printf 'x-access-token:%s' "$MUTATION_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"

          git \
            -c http.https://github.com/.extraheader= \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push origin \
              "refs/heads/$SYNC_BRANCH:refs/heads/$SYNC_BRANCH"

          echo "✅ Synchronization branch pushed."

      - name: 🔁 Create synchronization PR
        if: |
          !inputs.dry_run &&
          steps.release-push.outcome == 'success' &&
          steps.sync-push.outcome == 'success'
        id: sync-pr
        env:
          GH_TOKEN: ${{ steps.mutation-token.outputs.token }}
          PACKAGE: ${{ inputs.package }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
        run: |
          set -euo pipefail

          PR_BODY="$(printf \
            '## Release synchronization\n\nBrings all changes from `main` into `dev`, including the %s release metadata for version %s.\n\nThis includes code, documentation, workflow, and shared repository changes on `main` that are not yet in `dev`.\n\nAn empty `## Unreleased` section is added for future work.' \
            "$PACKAGE" \
            "$NEW_VERSION"
          )"

          PR_URL=$(gh pr create \
            --base dev \
            --head "$SYNC_BRANCH" \
            --title "chore(${PACKAGE}): sync release ${NEW_VERSION} to dev" \
            --body "$PR_BODY")

          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

          echo "✅ Synchronization PR created: $PR_URL"

      # ------------------------------------------------
      # Manual publishing instructions
      # ------------------------------------------------

      - name: 📋 Release summary
        if: |
          always() &&
          !inputs.dry_run &&
          steps.release-push.outcome == 'success'
        env:
          PACKAGE: ${{ inputs.package }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          PACKAGE_TYPE: ${{ steps.package.outputs.type }}
        run: |
          echo "========================================"
          echo "Release summary"
          echo "========================================"
          echo "Package : $PACKAGE"
          echo "Version : $NEW_VERSION"
          echo "Tag     : ${PACKAGE}-v${NEW_VERSION}"
          echo "Main + tag: ✅ pushed atomically"
          echo ""

          if [[ "${{ steps.sync.outcome }}" == "success" &&
                "${{ steps.sync-push.outcome }}" == "success" &&
                "${{ steps.sync-pr.outcome }}" == "success" ]]; then
            echo "Sync PR  : ✅ ${{ steps.sync-pr.outputs.url }}"
          else
            echo "Sync PR  : ❌ not created successfully"
            echo "Action   : inspect the failed synchronization step and create/fix the PR manually"
          fi

          echo ""
          echo "Publish manually:"
          echo ""
          echo "cd $PACKAGE_PATH"

          if [[ "$PACKAGE_TYPE" == "flutter" ]]; then
            echo "flutter pub publish"
          else
            echo "dart pub publish"
          fi
